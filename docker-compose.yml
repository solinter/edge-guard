version: "3.8"

services:
  edge-guard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GEOLITE2_COUNTRY_MMDB_URL: "${GEOLITE2_COUNTRY_MMDB_URL}"
        MAXMIND_ACCOUNT_ID: "${MAXMIND_ACCOUNT_ID}"
        MAXMIND_LICENSE_KEY: "${MAXMIND_LICENSE_KEY}"
        MAXMIND_EDITION_ID: "GeoLite2-Country"
    image: edge-guard:local
    container_name: edge-guard
    init: true
    ports:
      - "8080:8080"
    environment:
      EDGE_GUARD_LISTEN_ADDR: "0.0.0.0:8080"
      EDGE_GUARD_POLICY_FILE: "/app/config/policies.yaml"
      EDGE_GUARD_GEOIP_DB_FILE: "/app/data/GeoLite2-Country.mmdb"
      EDGE_GUARD_INLINE_POLICY_TOKEN: "change-me-inline-token"
